  spread_pct_full:
    value: 0.000027
    status: verified
    source: "SSGA SPY bid/ask: 0.27 bps (June 2024); 0.21 bps (March 2024)"
    note: "Liquid ETF only. Less-liquid ETFs (ETF.com: average US equity ETP spread 0.24%) must be measured individually."
  spread_pct_full_qqq:
    value: null
    status: not_found
    note: "QQQ-specific full spread must be measured from historical NBBO/quote data."
  spread_pct_full_iwm:
    value: null
    status: not_found
    note: "IWM-specific full spread must be measured from historical NBBO/quote data."
  spread_pct_full_gld:
