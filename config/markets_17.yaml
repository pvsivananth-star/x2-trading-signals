engine:
  mode: "demo"
  base_currency: "USD"
  daily_kitty_seed: 25000.0
  discovery_interval_mins: 30
  evaluation_interval_mins: 5
  pre_close_entry_cutoff_mins: 60
  mandatory_pre_close_flat_mins: 15
  regime_rules:
    NEWS_DAY:
      allow_new_entries: false
    CHOP_DAY:
      allow_new_entries: true
      max_risk_pct: 0.0008
    TREND_DAY:
      allow_new_entries: true
      a_tier_risk_pct: 0.0025
      b_tier_risk_pct: 0.0017

capital_allocation_pct:
  us_equities_etfs: 0.35
  europe: 0.20
  commodities: 0.15
  india: 0.15
  asia_pacific: 0.10
  crypto: 0.05

market_tiering:
  tier_a: ["FRANCE_EURONEXT", "JAPAN_TSE", "ASIA_PACIFIC_SLEEVE", "US_EQUITIES", "US_COMMODITIES_OIL"]
  tier_b: ["UK_LSE", "CANADA_TSX", "INDIA_NSE", "US_COMMODITIES_GOLD", "CRYPTO_MAJORS"]
  tier_c_probation:
    markets: ["GERMANY_XETRA", "SWEDEN_OMX"]
    target_pf: 1.25
  tier_d_disabled:
    markets: ["HONGKONG_HKEX"]
    min_pf_to_enable: 1.10

markets:
  US_EQUITIES:
    name: "US Equities & Index ETFs (NYSE/NASDAQ)"
    tier: "TIER_A"
    allocation_pct: 0.35
    enabled: true
    broker_route: "IBKR"
    cluster: "US_TECH_INDEX"
    cluster_risk_cap: 0.0050
    min_net_moveroom_pct: 0.0032
    est_roundtrip_cost_pct: 0.0006
    slot_rvol_min: 0.95
    core_symbols: ["SPY", "QQQ", "IWM", "AAPL", "AMZN", "META", "NFLX", "GOOGL", "MSFT", "NVDA", "AMD", "TSLA", "SPX", "^GSPC"]
    symbol_overrides:
