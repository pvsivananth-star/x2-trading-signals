strategy:
  id: "confluence_pullback_v1"
  enabled: true
  allowed_regimes: ["TREND_DAY", "CHOP_DAY"]
  timeframes:
    discovery_mins: 30
    signal_mins: 5
    swing_mins: 15
    require_completed_context: true
    max_context_age_mins: 30
  swing:
    min_candles: 3
    min_atr_mult: 0.60
    confirmation_bars: 2
  volume:
    # Compare each 5m bar with the same exchange-local wall-clock slot in prior sessions.
    slot_rvol_lookback_sessions: 10
    slot_rvol_min_sessions: 5
  execution:
    # Cancel unfilled quantity; the shared cost model applies fees, spread and slippage.
    partial_fill_ratio: 1.0
  reaction_zones:
    core_fib: { min: 0.382, max: 0.618, weight: 1.00 }
    shallow_vwap: { min: 0.236, max: 0.382, weight: 0.68, require_vwap_hold: true }
    deep_reclaim: { min: 0.618, max: 0.786, weight: 0.68, require_reclaim_close: true }
  exit:
    hold_while_trendline_intact: true
    exit_on_confirmed_trendline_break: true
    pre_close_entry_cutoff_mins: 60
    mandatory_flat_before_close_mins: 15
    # Hard cap measured from the actual next-bar entry fill, not signal time.
    max_holding_minutes: 240
    # Close after 60 minutes if the trade has not reached +0.25R favourable excursion.
    stagnation_minutes: 60
    stagnation_min_favorable_r: 0.25
  # Net MoveRoom (review v3). Target is structural-primary:
  #  - structural level above entry (swing high / prior session high / session high) is the target,
  #    capped at max_target_atr_mult * ATR_14 (signal timeframe);
  #  - ATR extension (target_atr_mult) is used ONLY when no structural level exists above entry
  #    (clear open space).
  # MoveRoom budgets 0.15% total here: 0.10% round-trip costs + 0.05% slippage.
  # Cost values are PLACEHOLDERS pending per-market spread/fee confirmation.
  move_room:
    structural_primary: true
    target_atr_mult: 3.5
    max_target_atr_mult: 4.0
    stop_atr_mult: 1.0
    min_reward_to_risk: 1.5
    roundtrip_cost_pct: 0.0010
    slippage_buffer_pct: 0.0005
