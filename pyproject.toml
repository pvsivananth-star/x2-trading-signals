[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "x2-trading-signals"
version = "0.1.0"
description = "Local-first market-data ingestion and trading research platform"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
runtime = [
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=17,<20",
  "PyYAML>=6,<7",
]
dev = [
  "PyYAML>=6,<7",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
x2-trading = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Keep the standard Ruff correctness rules explicit and stable across versions.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
